<!doctype html>
<html lang="ko"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><style>
body{font-family:Arial,sans-serif;background:#f5f6f8;color:#373a46;padding:24px;margin:0}main{max-width:460px;margin:auto;background:white;padding:28px;border:1px solid #e0e4ea;border-radius:8px}h1{font-size:24px}p{line-height:1.7;color:#6d7583}label{display:block;margin:18px 0;font-size:14px}input,select,button{font:inherit;box-sizing:border-box;width:100%;padding:12px;border:1px solid #cfd5df;border-radius:5px;margin-top:7px;background:white}button{background:#373a46;color:white;cursor:pointer}button:disabled{opacity:.5}#status{min-height:26px}
</style></head><body><main><h1>오늘의 마음 체크인</h1><p>연수용 가상 응답만 입력합니다.<br>실제 학생 이름이나 개인 사정은 적지 않습니다.</p><form id="checkin">
<label>가상ID<input name="studentId" required pattern="S[0-9]{2}" maxlength="3" placeholder="S01"></label>
<label>주차<select name="week"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
<label>감정<select name="emotion" required><option value="">선택하세요</option><option>편안</option><option>기쁨</option><option>걱정</option><option>속상</option><option>말하고 싶지 않음</option></select></label>
<label>오늘의 편안함 (선택)<select name="score"><option value="">응답하지 않음</option><option value="1">1 · 전혀 편안하지 않음</option><option>2</option><option>3</option><option>4</option><option value="5">5 · 매우 편안함</option></select></label>
<label>상황<select name="context" required><option value="">선택하세요</option><option>발표 전</option><option>짝 활동</option><option>개별 활동</option><option>쉬는 시간</option><option>응답하지 않음</option></select></label>
<button id="send" type="submit">가상 응답 저장</button></form><p id="status" role="status" aria-live="polite"></p><script>
const form=document.getElementById('checkin');
const status=document.getElementById('status');
const button=document.getElementById('send');
let requestId=crypto.randomUUID();
form.addEventListener('submit',function(event){
 event.preventDefault(); if(!form.reportValidity())return;
 const payload=Object.fromEntries(new FormData(form).entries());payload.requestId=requestId;
 button.disabled=true;status.textContent='저장 중입니다…';
 google.script.run.withSuccessHandler(function(result){
  status.textContent=result.message;form.reset();requestId=crypto.randomUUID();button.disabled=false;
 }).withFailureHandler(function(error){
  status.textContent='저장하지 못했습니다: '+error.message;button.disabled=false;
 }).submitCheckin(payload);
});
</script></main></body></html>
